[workspace]
members = [
#    "perl",
#    "perl-compiler",
    "perl-core",
    "perl-parser",
#    "perl-regex",
#    "perl-runtime",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"

# The 1.89 floor is set by _mm256_cmple_epu8_mask in the AVX-512 digit-run kernel, stable since 1.89.0.  The other
# ceilings beneath it: safe computation intrinsics inside #[target_feature] need 1.87, slice::as_chunks needs 1.88,
# and edition 2024 needs 1.85.  Raise this only when something demands it, and record what did.
rust-version = "1.89"

[workspace.dependencies]
bytes                 = "1.11.1"
hashbrown             = "0.17.1"
imbl                  = "7.0.1"
indexmap              = "2.14.0"
memchr                = "2.8.0"
parking_lot           = "0.12.5"
phf                   = { version = "0.13.1", features = ["macros"] }
phf_codegen           = "0.13.1"
phf_generator         = "0.13.1"
phf_macros            = "0.13.1"
phf_shared            = "0.13.1"
tikv-jemalloc-ctl     = { version = "0.7.0", features = ["stats"] }
tikv-jemalloc-sys     = "0.7.0"
unicode-normalization = "0.1.25"
unicode-xid           = "0.2.6"
unicode_names2        = "2.0.0"
